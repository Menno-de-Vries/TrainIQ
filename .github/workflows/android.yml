name: Android validation

'on':
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Manual Android operation
        required: true
        type: choice
        default: room-migration-marker
        options:
          - room-migration-marker
          - signed-release

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: TrainIQ-Project

jobs:
  pull-request-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Validate Android pull request
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:compileDebugAndroidTestKotlin \
            :macrobenchmark:compileProfileableJavaWithJavac \
            --console=plain --no-configuration-cache --no-daemon

  room-migration-marker:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'room-migration-marker'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Generate Room migration-chain markers
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            cd TrainIQ-Project
            chmod +x gradlew
            ./gradlew :app:generateCiRoomMigrationChainVerificationMarkers --console=plain --no-configuration-cache --no-daemon
      - name: Upload Room migration markers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: room-migration-chain-markers
          path: TrainIQ-Project/app/build/generated/roomMigrationVerification/**/assets/room_migration_chain_verification_marker.json
          if-no-files-found: error
          retention-days: 14

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'signed-release'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: trainiq-release
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Verify Room migrations
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            cd TrainIQ-Project
            chmod +x gradlew
            ./gradlew :app:generateCiRoomMigrationChainVerificationMarkers --console=plain --no-configuration-cache --no-daemon
      - name: Prepare release keystore
        env:
          TRAINIQ_KEYSTORE_BASE64: ${{ secrets.TRAINIQ_KEYSTORE_BASE64 }}
        run: |
          test -n "$TRAINIQ_KEYSTORE_BASE64"
          printf '%s' "$TRAINIQ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trainiq-release.keystore"
          echo "TRAINIQ_KEYSTORE_FILE=$RUNNER_TEMP/trainiq-release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          TRAINIQ_KEYSTORE_PASSWORD: ${{ secrets.TRAINIQ_KEYSTORE_PASSWORD }}
          TRAINIQ_KEY_ALIAS: ${{ secrets.TRAINIQ_KEY_ALIAS }}
          TRAINIQ_KEY_PASSWORD: ${{ secrets.TRAINIQ_KEY_PASSWORD }}
        run: ./gradlew :app:checkReleaseSigningReadiness :app:assembleRelease :app:bundleRelease --console=plain --no-configuration-cache --no-daemon
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trainiq-signed-release
          path: |
            TrainIQ-Project/app/build/outputs/apk/release/*.apk
            TrainIQ-Project/app/build/outputs/bundle/release/*.aab
            TrainIQ-Project/app/build/generated/roomMigrationVerification/**/assets/room_migration_chain_verification_marker.json
          if-no-files-found: error
          retention-days: 14
