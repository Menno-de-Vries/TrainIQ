name: Android

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TrainIQ-Project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Compile Android tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin --console=plain

      - name: Compile macrobenchmark
        run: ./gradlew :macrobenchmark:compileProfileableJavaWithJavac --console=plain

      - name: Release signing readiness
        run: ./gradlew :app:checkReleaseSigningReadiness --console=plain

  room-migration-marker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TrainIQ-Project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate CI Room migration marker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: TrainIQ-Project
          script: ./gradlew :app:generateCiRoomMigrationChainVerificationMarkers --console=plain

  signed-release:
    runs-on: ubuntu-latest
    needs:
      - validate
      - room-migration-marker
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      secrets.TRAINIQ_KEYSTORE_BASE64 != '' &&
      secrets.TRAINIQ_KEYSTORE_PASSWORD != '' &&
      secrets.TRAINIQ_KEY_ALIAS != '' &&
      secrets.TRAINIQ_KEY_PASSWORD != '' }}
    defaults:
      run:
        working-directory: TrainIQ-Project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          TRAINIQ_KEYSTORE_BASE64: ${{ secrets.TRAINIQ_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/trainiq-signing"
          printf '%s' "$TRAINIQ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trainiq-signing/trainiq-release.jks"

      - name: Build signed release artifacts
        env:
          TRAINIQ_KEYSTORE_FILE: ${{ runner.temp }}/trainiq-signing/trainiq-release.jks
          TRAINIQ_KEYSTORE_PASSWORD: ${{ secrets.TRAINIQ_KEYSTORE_PASSWORD }}
          TRAINIQ_KEY_ALIAS: ${{ secrets.TRAINIQ_KEY_ALIAS }}
          TRAINIQ_KEY_PASSWORD: ${{ secrets.TRAINIQ_KEY_PASSWORD }}
        run: ./gradlew :app:checkReleaseSigningReadiness :app:assembleRelease :app:bundleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: trainiq-signed-release
          path: |
            TrainIQ-Project/app/build/outputs/apk/release/*.apk
            TrainIQ-Project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
